name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-tag-version.sh

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: '.exe'
          - os: macos-latest
            target: x86_64-apple-darwin
            exe: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: |-
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/dbi-backend${{ matrix.exe }}" \
             "stage/dbi-backend-${{ matrix.target }}${{ matrix.exe }}"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: stage/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
      - name: Pack archives and checksums
        run: |-
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          mkdir -p out
          for target in x86_64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            dir="dbi-backend-$version-$target"
            mkdir -p "$dir"
            cp "dist/binary-$target/dbi-backend-$target" "$dir/dbi-backend"
            tar -czf "out/$dir.tar.gz" "$dir"
          done
          target=x86_64-pc-windows-msvc
          dir="dbi-backend-$version-$target"
          mkdir -p "$dir"
          cp "dist/binary-$target/dbi-backend-$target.exe" "$dir/dbi-backend.exe"
          zip -qr "out/$dir.zip" "$dir"
          cd out && sha256sum *.tar.gz *.zip > SHA256SUMS.txt
      - run: gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
