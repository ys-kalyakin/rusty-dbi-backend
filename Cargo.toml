[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A USB and HTTP install backend for DBI, the Nintendo Switch homebrew installer"
repository = "https://github.com/ys-kalyakin/rusty-dbi-backend"
readme = "README.md"
keywords = ["nintendo-switch", "dbi", "usb", "homebrew", "installer"]

[workspace.dependencies]
dbi-backend-core = { path = "crates/core", version = "0.1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
nusb = { version = "0.2", features = ["tokio"] }
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
smb2 = "0.34"
globset = "0.4"
axum = "0.8"
tokio-stream = "0.1"
